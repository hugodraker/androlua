name: Build AndroLua APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup exact Gradle version
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.0.2'

    - name: Normalize Package Declarations to HUGO.androlua
      run: |
        find app/src/main/HUGO/androlua -name "*.java" -exec sed -i 's/^package .*;$/package HUGO.androlua;/g' {} +
        find app/src/main/HUGO/androlua -name "*.java" -exec sed -i 's/com\.example\.androlua/HUGO.androlua/g' {} +

    - name: Generate Root Gradle Files
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = 'AndroLua'" >> settings.gradle
        echo "include ':app'" >> settings.gradle

        echo "plugins { id 'com.android.application' version '8.0.2' apply false }" > build.gradle

        echo "android.useAndroidX=false" > gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/androlua.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: androlua
        path: app/build/outputs/apk/debug/androlua.apk
